version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: redis-queue
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pipeline
    restart: unless-stopped
    command: redis-server --appendonly yes

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - pipeline
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.11.0-pg15
    container_name: postgres-db
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline123
      POSTGRES_DB: oxygen_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pipeline
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - pipeline
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - pipeline
    restart: unless-stopped
    depends_on:
      - prometheus

  stream-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.stream
    container_name: stream-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - STREAM_NAME=sensor:stream
      - DLQ_STREAM=sensor:dlq
      - CONSUMER_GROUP=sensor-group
      - MAX_RETRIES=3
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=oxygen_data
      - DB_USER=pipeline
      - DB_PASSWORD=pipeline123
    volumes:
      - ./worker:/app
    networks:
      - pipeline
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    command: python stream_processor.py --mode worker

  replay-service:
    build:
      context: ./worker
      dockerfile: Dockerfile.stream
    container_name: replay-service
    environment:
      - REDIS_URL=redis://redis:6379
      - STREAM_NAME=sensor:stream
      - DLQ_STREAM=sensor:dlq
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=oxygen_data
      - DB_USER=pipeline
      - DB_PASSWORD=pipeline123
    volumes:
      - ./worker:/app
    networks:
      - pipeline
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    command: python stream_processor.py --mode replay

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: pipeline-monitor
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/var/log
    networks:
      - pipeline
    depends_on:
      - redis
      - postgres
      - mqtt
      - stream-worker
    restart: unless-stopped
    command: python scripts/monitor.py --collect-interval 10 --alarm-interval 30

networks:
  pipeline:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data: