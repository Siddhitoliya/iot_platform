alarms:
  - name: mqtt_down
    metric: mqtt_health
    period: 60
    threshold: 0.5
    comparison: lt
    severity: critical
  - name: redis_down
    metric: redis_health
    period: 60
    threshold: 0.5
    comparison: lt
    severity: critical
  - name: postgres_down
    metric: postgres_health
    period: 60
    threshold: 0.5
    comparison: lt
    severity: critical
  - name: queue_backlog
    metric: redis_total_queue_size
    period: 60
    threshold: 100
    comparison: gt
    severity: warning